apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shanano
spec:
  type: NodePort
  selector:
    app: shanano-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shanano
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shanano-api
  template:
    metadata:
      labels:
        app: shanano-api
    spec:
      containers:
        - name: api
          image: shanano-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: shanano-config
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
