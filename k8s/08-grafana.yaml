apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: shanano
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: shanano
data:
  dashboard.yml: |
    apiVersion: 1

    providers:
      - name: "Shanano"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
  shanano.json: |
    {
      "title": "Shanano",
      "uid": "shanano",
      "tags": ["shanano"],
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "title": "Songs Uploaded",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(shanano_songs_uploaded_total)",
              "legendFormat": "Total"
            }
          ]
        },
        {
          "title": "Songs by Status",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "sum by(job, status) (shanano_songs_by_status{job=\"shanano-api\"})",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "title": "Songs Processed (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "rate(shanano_songs_processed_total[5m])",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "title": "Processing Duration (p99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, rate(shanano_processing_duration_seconds_bucket[5m]))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "title": "HTTP Requests (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 8 },
          "targets": [
            {
              "expr": "rate(shanano_http_requests_total[5m])",
              "legendFormat": "{{method}} {{endpoint}}"
            }
          ]
        },
        {
          "title": "HTTP Request Duration (p99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, rate(shanano_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "{{method}} {{endpoint}}"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: shanano
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: shanano
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: shanano
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
