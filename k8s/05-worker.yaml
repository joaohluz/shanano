apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: shanano
spec:
  type: NodePort
  selector:
    app: shanano-worker
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shanano
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shanano-worker
  template:
    metadata:
      labels:
        app: shanano-worker
    spec:
      containers:
        - name: worker
          image: shanano-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          envFrom:
            - configMapRef:
                name: shanano-config
          ports:
            - name: metrics
              containerPort: 8001
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
