apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: shanano
spec:
  type: NodePort
  selector:
    app: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30050
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: shanano
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@shanano.dev
            - name: PGADMIN_DEFAULT_PASSWORD
              value: shanano
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
