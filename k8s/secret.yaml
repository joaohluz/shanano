apiVersion: v1
kind: Secret
metadata:
  name: shanano-secrets
  namespace: shanano
type: Opaque
# Local kind dev cluster only — replace these values for any real deployment.
# JWT_SECRET is what the API signs/verifies bearer tokens with; ADMIN_* and
# LOADGEN_* are the bootstrap accounts seeded by seed_users at startup
# (loadgen is seeded as an admin so its delete requests are authorized).
stringData:
  JWT_SECRET: change-me
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin
  LOADGEN_USERNAME: loadgen
  LOADGEN_PASSWORD: loadgen
