services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shanano
      POSTGRES_PASSWORD: shanano
      POSTGRES_DB: shanano
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shanano"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://shanano:shanano@db:5432/shanano
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    entrypoint: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://shanano:shanano@db:5432/shanano
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shanano.dev
      PGADMIN_DEFAULT_PASSWORD: shanano
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
  uploads:
